name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv export --frozen --no-dev --extra litellm --format requirements-txt --no-hashes --no-emit-project -o deploy/constraints.txt
      - run: git diff --exit-code deploy/constraints.txt
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pyflakes src tests

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINT_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev --extra litellm
      - run: uv run --no-sync pytest tests/unit
