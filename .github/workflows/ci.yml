name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pyflakes src tests

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINT_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit

  changes:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git diff --name-only "$base" HEAD | grep -q '^tests/integration/'; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.integration == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINT_E_READY: ${{ vars.MINT_E_READY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: docker compose -f tests/integration/compose.yaml up -d --build --wait --wait-timeout 300
      - run: pytest tests/integration -ra
      - if: always()
        run: docker compose -f tests/integration/compose.yaml logs --no-color > integration-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs.txt
      - if: always()
        run: docker compose -f tests/integration/compose.yaml down -v
