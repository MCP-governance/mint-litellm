model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  require_key_mcp_access_defined: true
  mcp_allow_all_keys_respects_mcp_scope: true
  store_prompts_in_spend_logs: false

litellm_settings:
  telemetry: false
  user_url_validation: true
  key_generation_settings:
    personal_key_generation:
      allowed_user_roles: [proxy_admin]

mcp_servers:
  playwright:
    server_id: playwright
    url: https://cnt:8443/playwright/mcp
    transport: http
    allow_all_keys: false
  context7:
    server_id: context7
    url: https://cnt:8443/context7/mcp
    transport: http
    allow_all_keys: false
  grafana:
    server_id: grafana
    url: https://cnt:8443/grafana/mcp
    transport: http
    allow_all_keys: false
  synthetic:
    server_id: synthetic
    url: https://cnt:8443/synthetic/mcp
    transport: http
    allow_all_keys: false
